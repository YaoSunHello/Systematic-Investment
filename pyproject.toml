[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systrading"
version = "0.1.0"
description = "Carver-style systematic trading decision-support framework"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.scripts]
systrading = "systrading.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

